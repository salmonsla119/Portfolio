<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#23272c">
  <title>김채연 | 게임 기획자</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>


<main id="main" class="hero-wrap">
  <section class="frame">
    <!-- 피그마 1905x942 캔버스를 그대로 옮긴 무대. 좌표는 assets/style.css 참고 -->
    <div class="stage-fx" id="stage-fx">
      <div class="fx-head">
        <span class="fx-ico" data-ico="hybrid"></span>
        <p class="fx-t1">철두철미한</p>
        <p class="fx-t2">하이브리드 기획자</p>
        <p class="fx-t3">김채연</p>
      </div>

      <div class="fx-nav">
        <a class="frame-pill" href="resume.html" data-ico="doc">이력서</a>
        <a class="frame-pill" href="cover-letter.html" data-ico="pen">자기소개서</a>
        <a class="frame-pill" href="#projects" data-ico="grid">프로젝트</a>
      </div>

      <ul class="fx-spec" id="spec-list"></ul>

      <img class="fx-portrait" src="assets/images/portrait.webp" alt="" aria-hidden="true">
      <!-- 바닥 선 아래를 덮어 그림 밑동을 잘라 주는 띠 (피그마의 #23272c 1905x80) -->
      <div class="fx-mask"></div>
      <div class="fx-ground"></div>

      <div class="fx-screen">
        <div class="screen" id="stage"></div>
        <a class="nav-label" id="stage-link" href="project.html" data-ico="film">프로젝트 보기</a>
      </div>

      <div class="fx-rail"></div>
      <div class="fx-arrows">
        <button type="button" class="arrow" data-dir="-1" aria-label="이전 프로젝트">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
        </button>
        <button type="button" class="arrow" data-dir="1" aria-label="다음 프로젝트">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
        </button>
      </div>

      <img class="fx-brush" src="assets/images/brush-jar.webp" alt="" aria-hidden="true">
      <div class="fx-panel" id="spec-panel" hidden></div>
    </div>
  </section>

  <section class="more on-light" id="projects">
    <div class="wrap">
      <h2 class="more-title" data-ico="grid">프로젝트 <b>더보기</b></h2>
      <div class="proj-grid" id="project-grid"></div>
    </div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
